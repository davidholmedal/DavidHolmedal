
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustCalc</title>
    <style>
      body {
  font-family: verdana;
  font-weight: 800;
}


table{
  width: 100%;
}

td {
  padding: .1em 1em .1em 1em;
}

input{
  outline: .25em solid gray;
  border: none;
  padding: .2em .0em .2em .3em;
  border-radius: .5em;
  font-size: 1.25em;
  font-weight: 100;
}

#expr_field {
  width: 100%;
  min-width: 60px;
}

#result_field {
  width: 100%;
  min-width: 60px;
}

    </style>
  <script>

pi = Math.PI;
e = Math.E;
degtorad =(2*Math.PI)/360.0;
radtodeg =360.0/(2*pi);

function sqrt(a){ return Math.sqrt(a);}
function abs(a){ return Math.abs(a);}
function floor(a){ return Math.floor(a);}
function ceil(a){ return Math.ceil(a);}
function round(a){ return Math.round(a);}

function cos(a){ return Math.cos(degtorad*a);}
function sin(a){ return Math.sin(degtorad*a);}
function tan(a){ return Math.tan(degtorad*a);}
function acos(a){ return radtodeg*Math.acos(a);}
function asin(a){ return radtodeg*Math.asin(a);}
function atan(a){ return radtodeg*Math.atan(a);}
function atan2(a, b){ return radtodeg*Math.atan2(a, b);}



function setup(){
  console.log("setup()");
}


function _eval(){
  let expr = document.getElementById("expr_field").value;
  console.log("expr = " + expr);
  let result = eval(expr);
  console.log("result = " + result);
  document.getElementById("result_field").value = result;
}

    
  </script>
  
</head>
<body onload="setup()">
  
  <table>
    <tr><td>Expression</td><td>Result</td></tr>
    <tr><td><input type="text" id="expr_field" name="expr_field" onkeyup="_eval()"></td><td><input type="text" id="result_field" name="result_field" readonly=true></td></tr>
  </table>
</body>
</html>
