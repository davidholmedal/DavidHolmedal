
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="justcalc.css" rel="stylesheet">
  <script src="justcalc.js"></script>
  
  <title>JustCalc</title>  
</head>



<body onload="setup()">
  <table>
    <tr><td id="col1">Expression</td><td id="col2">Result</td></tr>
    <tr>
      <td>
      <div style="display:flex; height:100%; width:100%;">
        <textarea id="expr_field" name="expr_field" spellcheck="false" autofocus placeholder="Enter expression such as:
cos(45)
a = 5
b = a + 10
diameter = 20
circumference = pi * diameter
sqrt(25)
// this is a comment
5**2  // = 25 Exponentiation is written with **
degs = pi*radtodeg
rads = degs*degtorad
ln(e**2) // = 2 
log10(1000) // = 3
log2(8) // = 3
++ gets replaced by '('
-- gets replaced by ')'
" ></textarea>
      </div>
      </td>
      
      <td>
        <div style="display:flex; height:100%; width:100%;">
          <textarea type="text" id="result_field" name="result_field" spellcheck="false" readonly=true></textarea>
        </div>
        </td>
      </tr>
  </table>
</body>
</html>
