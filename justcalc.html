
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustCalc</title>
    <style>
* {
  outline: 0px solid red;
  margin: 0;
}

body {
  font-family: verdana;
  font-weight: 800;
  position: absolute;
  padding: 0em;
  width: 100%;
  height: 100%;
}


table{
  position: absolute;
  top: 1.5em;
  left: 1.5em;
  width: calc(100% - 3em);
  height: calc(100% - 3em);
}

#col1 {
  padding: .1em 1em .1em 1em;
  height: 2em;
  width: 50%;
  min-width: 100px;
}

#col2 {
  padding: .1em 1em .1em 1em;
  width: 10%;
  min-width: 100px;
}

td {
  padding: 1em;
}

textarea {
  box-sizing:border-box;
  background-image: linear-gradient(lightgray 10%, white 10%, white 60%, lightgray 60% );
  background-size: 100% 3rem;
  border: .25em solid gray;
  padding: .4em .75em .4em .75em;
  border-radius: .5em;
  font-size: 1.25em;
  line-height: 1.5rem;
  font-weight: 100;
  width: 100%;
  height: 100%;
  resize: none;
}

    </style>
  <script>
    
pi = Math.PI;
e = Math.E;
degtorad =(2*Math.PI)/360.0;
radtodeg =360.0/(2*pi);

function sqrt(a){ return Math.sqrt(a);}
function abs(a){ return Math.abs(a);}
function floor(a){ return Math.floor(a);}
function ceil(a){ return Math.ceil(a);}
function round(a){ return Math.round(a);}

function cos(a){ return Math.cos(degtorad*a);}
function sin(a){ return Math.sin(degtorad*a);}
function tan(a){ return Math.tan(degtorad*a);}
function acos(a){ return radtodeg*Math.acos(a);}
function asin(a){ return radtodeg*Math.asin(a);}
function atan(a){ return radtodeg*Math.atan(a);}
function atan2(a, b){ return radtodeg*Math.atan2(a, b);}



function setup(){
  console.log("setup()");
}


function _eval(){
  //let expr = document.getElementById("expr_field").value;
  let txt = document.getElementById("expr_field").value;
  const lines = txt.split(/\r?\n/);
  console.log(lines);
  
  let results = [];
  for (let line of lines){
    if (line.trim().length === 0) {
      results.push("");
      continue;
    }
    results.push(eval(line));
  }
  
  
  console.log("results = " + results);
  let results_txt = "";
  for (const res of results){
    results_txt += res + "\n";
  }
  document.getElementById("result_field").value = results_txt;
}
    
  </script>
  
</head>
<body onload="setup()">
  
  <table>
    <tr><td id="col1">Expression</td><td id="col2">Result</td></tr>
    <tr>
      <td>
      <div style="display:flex; height:100%; width:100%;">
        <textarea id="expr_field" name="expr_field" onkeyup="_eval()"></textarea>
      </div>
      </td>
      
      <td>
        <div style="display:flex; height:100%; width:100%;">
          <textarea type="text" id="result_field" name="result_field" readonly=true></textarea>
        </div>
        </td>
      </tr>
  </table>
</body>
</html>
