
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JustCalc</title>
    
  <script>

degtorad =(2*Math.PI)/360.0;
radtodeg =360.0/(2*Math.PI);

function sqrt(a){ return Math.sqrt(a);}
function abs(a){ return Math.abs(a);}
function floor(a){ return Math.floor(a);}
function ceil(a){ return Math.ceil(a);}
function round(a){ return Math.round(a);}

function cos(a){ return Math.cos(degtorad*a);}
function sin(a){ return Math.sin(degtorad*a);}
function tan(a){ return Math.tan(degtorad*a);}
function acos(a){ return radtodeg*Math.acos(a);}
function asin(a){ return radtodeg*Math.asin(a);}
function atan(a){ return radtodeg*Math.atan(a);}
function atan2(a, b){ return radtodeg*Math.atan2(a, b);}



function setup(){
//  alert("setup");
  console.log("cos 45 = " + cos(45));
  console.log("2**3 = " + 2**3);
  
  console.log("is atan 1 = 45: " + atan(1));
  console.log("is acos(1/sqrt(2)) = 45: " + acos(1/sqrt(2)));
  
}


function _eval(str){
  let expr = document.getElementById("expr_field").value;
  console.log("expr = " + expr);
  let result = eval(expr);
  console.log("result = " + result);
  document.getElementById("result_field").value = result;
}

  </script>
  
</head>
<body onload="setup()">
  <button onclick="setup()">setup()</button>
  <br>
    <label for="expr_field">Expr:</label>
    <input type="text" id="expr_field" name="expr_field" onkeyup="_eval()">
    <label for="result_field">Result</label>
    <input type="text" id="result_field" name="result_field" readonly=true>
  
  <button onclick="_eval()">eval()</button>
</body>
</html>
