<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Navigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
        font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 800;
    }

    .nav {
      display: flex;
      background: white;
      padding: 10px;
      gap: 10px;
    }
    .nav button {
      font-size: 2em;
      background: white;
      border: none;
      padding: 10px 16px;
      color: Black;
      cursor: pointer;
      /*text-transform: uppercase;*/
      border-top: .2em solid rgba(0,0,0,0);
      transition: border-color .5s;
    }
    .nav button:hover {
      transition: border-color 1s;
      border-top: .2em solid gray;
    }
    .nav button.sel  {
      transition: border-color .5s;
      border-top: .2em solid black;
      
    }
    .page {
      display: none;
      padding: 20px;
    }
    .page.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="nav" id="nav">
    <button class="btn sel" onclick="showPage('p1')">Vfx</button>
    <button class="btn" onclick="showPage('p2')">Reindeer</button>
    <button class="btn" onclick="showPage('p3')">Old Stuff</button>
  </div>

  <div id="p1" class="page active"><div style='padding:56.25% 0 0 0;position:relative;'><iframe src='https://vimeo.com/showcase/5453881/embed2' allow='fullscreen; clipboard-write;' frameborder='0' style='position:absolute;top:0;left:0;width:100%;height:100%;'></iframe></div></div>
  <div id="p2" class="page"><div style='padding:56.25% 0 0 0;position:relative;'><iframe src='https://vimeo.com/showcase/11986671/embed2' allow='fullscreen; clipboard-write;' frameborder='0' style='position:absolute;top:0;left:0;width:100%;height:100%;'></iframe></div></div>
  <div id="p3" class="page">
<div style='padding:56.25% 0 0 0;position:relative;'><iframe src='https://vimeo.com/showcase/11986668/embed2' allow='fullscreen; clipboard-write;' frameborder='0' style='position:absolute;top:0;left:0;width:100%;height:100%;'></iframe></div>This is Page 3.</div>
  

  <script>
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      
      
      // Add active class to the current button (highlight it)
      var header = document.getElementById("nav");
      var btns = header.getElementsByClassName("btn");
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function() {
        var current = document.getElementsByClassName("sel");
        current[0].className = current[0].className.replace(" sel", "");
        this.className += " sel";
        });
      }
    }
  </script>
  
</body>
</html>
